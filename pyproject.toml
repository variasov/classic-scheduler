[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "classic-scheduler"
version = "1.4.1"
authors = [
    {name = "Sergei Variasov", email = "variasov@gmail.com"},
]
description = "Simple in-process scheduler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "croniter~=3.0",
]

[project.urls]
Homepage = "https://github.com/variasov/classic-scheduler"

[dependency-groups]
dev = [
    "pyright[nodejs]~=1.1.414",
    "pytest~=9.2.0",
    "pytest-cov~=7.1",
    "ruff~=0.17.3",
    "vulture~=2.16",
]

[tool.setuptools.packages.find]
where = ["sources"]

[tool.setuptools.package-data]
"classic.scheduler" = ["py.typed"]

[tool.pyright]
include = ["sources", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
extraPaths = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]  # ruff would reformat python snippets in README

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # keeps D211: no blank line before class docstring
    "D213",     # keeps D212: multi-line summary on first line
    "EM",       # error-message style is overly prescriptive
    "TRY003",   # long exception messages are an API concern
    "D205",     # docstrings use wrapped multi-line summaries (Russian text)
    "RUF002",   # docstrings are in Russian: Cyrillic letters are intended
    "RUF003",   # comments are in Russian: Cyrillic letters are intended
    "CPY001",   # no copyright headers in this project
    "ANN401",   # Task subclasses forward *args/**kwargs to Task.__init__
    "LOG015",   # tasks log to the root logger; changing it alters log names
    "TRY401",   # logging.exception message format is kept as is
    "COM812",   # conflicts with the ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "SLF001",
    "S101",     # `assert` is idiomatic in pytest
    "D",        # tests do not need docstrings
    "ANN",      # test annotations are optional
    "PLR2004",  # magic values are acceptable in assertions
    "CPY001",   # tests do not carry copyright headers
    "INP001",   # tests are not a package (no tests/__init__.py)
]
"sources/classic/scheduler/scheduler.py" = [
    "FBT001",   # start(daemon)/stop(block) boolean flags are public API
    "FBT002",
    "PLR0913",  # by_cron() signature is public API
    "PLR0917",
]

[tool.vulture]
paths = ["sources", "tests"]
min_confidence = 60
